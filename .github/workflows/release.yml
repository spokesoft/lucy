name: Build and publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      CONSOLE_PROJECT: 'src/Console/Console.csproj'
      ARTIFACTS_DIR: './artifacts'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Ensure on master branch
        run: |
          git fetch origin
          git checkout master
          git pull origin master

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Update version numbers
        run: ./scripts/version.sh "${GITHUB_REF_NAME#v}"

      - name: Update changelog
        run: ./scripts/changelog.sh "${GITHUB_REF_NAME#v}"

      - name: Commit version and changelog updates
        env:
          REF_NAME: ${{ github.ref_name }}
          AUTHOR_NAME: ${{ github.actor }}
          AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "${AUTHOR_NAME}"
          git config user.email "${AUTHOR_EMAIL}"
          git add Directory.Build.props || true
          git add CHANGELOG.md || true

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): Update for release ${REF_NAME} [skip ci]"
          else
            echo "No changes to commit"
            return 1
          fi

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin master

      - name: Restore solution dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Test solution
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack Tool
        run: dotnet pack "${CONSOLE_PROJECT}" --configuration Release --no-build --output "${ARTIFACTS_DIR}"

      - name: Publish package to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/Spokesoft.Lucy.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
