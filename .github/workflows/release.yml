name: Build and publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to build/publish (e.g. v0.0.1)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      CONSOLE_PROJECT: 'src/Console/Console.csproj'
      ARTIFACTS_DIR: './artifacts'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Select branch if running from a tag or manual input
      - name: Set release context
        id: set_context
        run: |
          # Use tag from workflow_dispatch or ref_name from tag push
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
          # Always use master for updates
          echo "RELEASE_BRANCH=master" >> $GITHUB_ENV

      - name: Checkout release branch
        run: |
          git fetch origin $RELEASE_BRANCH
          git checkout $RELEASE_BRANCH
          git pull origin $RELEASE_BRANCH

      # Version & changelog updates, commit/push to branch
      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Update version numbers
        run: ./scripts/version.sh "${RELEASE_TAG#v}"

      - name: Update changelog
        run: ./scripts/changelog.sh "${RELEASE_TAG#v}"

      - name: Commit version and changelog updates
        env:
          AUTHOR_NAME: ${{ github.actor }}
          AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "${AUTHOR_NAME}"
          git config user.email "${AUTHOR_EMAIL}"
          git add Directory.Build.props || true
          git add CHANGELOG.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): Update for release $RELEASE_TAG [skip ci]"
            git push origin $RELEASE_BRANCH
          else
            echo "No changes to commit"
          fi

      - name: Restore solution dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Test solution
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack Tool
        run: dotnet pack "$CONSOLE_PROJECT" --configuration Release --no-build --output "$ARTIFACTS_DIR"

      - name: Publish package to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push $ARTIFACTS_DIR/Spokesoft.Lucy.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json